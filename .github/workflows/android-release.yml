name: Build & Publish Signed APK (GitHub Releases)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read version from pubspec.yaml
        shell: bash
        run: |
          RAW=$(grep '^version:' pubspec.yaml | awk '{print $2}')   # ej: 0.1.0+1
          VERSION=$(echo "$RAW" | cut -d'+' -f1)                    # 0.1.0
          BUILD=$(echo "$RAW" | awk -F'+' '{print $2}')             # 1
          echo "RAW=$RAW" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD=$BUILD" >> $GITHUB_ENV
          echo "TAG=v$VERSION" >> $GITHUB_ENV
          echo "APK_NAME=cementcalc-$VERSION+$BUILD.apk" >> $GITHUB_ENV

      - name: Validate signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || (echo "::error::Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || (echo "::error::Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          [ -n "$ANDROID_KEY_PASSWORD" ] || (echo "::error::Missing ANDROID_KEY_PASSWORD" && exit 1)
          [ -n "$ANDROID_KEY_ALIAS" ] || (echo "::error::Missing ANDROID_KEY_ALIAS" && exit 1)

      - name: Write keystore + key.properties
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          ls -lah android/app/upload-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "key.properties written:"
          sed 's/=.*/=***REDACTED***/' android/key.properties || true

      - name: Pub get
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Rename APK
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "${APK_NAME}"
          ls -lah "${APK_NAME}"

      - name: Delete previous asset (if exists)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete-asset "$TAG" "$APK_NAME" -y || true
          fi

      - name: Create/Update Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: CementCalc ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ env.APK_NAME }}
